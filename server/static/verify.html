<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Passport — verifica ricevuta</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--line:#222a3a;--txt:#e6e9f0;--mut:#8b95a8;--acc:#5b8cff;--ok:#34d399;--bad:#f87171;--mono:ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:32px 24px 60px}
  h1{font-size:23px;margin:0 0 4px;letter-spacing:-.02em}
  h1 .tag{color:var(--acc)}
  p.sub{color:var(--mut);margin:6px 0 20px}
  label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 4px}
  textarea{width:100%;background:#0e1320;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px;font:13px var(--mono);resize:vertical;line-height:1.45}
  button{appearance:none;border:0;background:var(--acc);color:#fff;font:600 14px system-ui;padding:11px 18px;border-radius:10px;cursor:pointer;margin-top:16px}
  .out{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:none}
  .out.show{display:block}
  .verdict{font:700 19px system-ui;margin:0 0 8px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font:13px var(--mono)}
  .checks .y{color:var(--ok)} .checks .n{color:var(--bad)} .checks .skip{color:var(--mut)}
  .meta{color:var(--mut);font:12.5px var(--mono);margin-top:10px}
  a{color:var(--acc)}
</style>
</head>
<body>
<main>
  <h1>Agent <span class="tag">Passport</span> — verifica ricevuta</h1>
  <p class="sub">Incolla un contenuto e la sua ricevuta. Ti dico chi l'ha prodotto, sotto quale
  mandato umano, entro quale scope — e se è ancora valido. <a href="/">torna alla demo</a></p>

  <label>Contenuto (i byte esatti)</label>
  <textarea id="content" rows="5" spellcheck="false"></textarea>
  <label>Ricevuta (Content Receipt, VC-JWT)</label>
  <textarea id="receipt" rows="4" spellcheck="false"></textarea>
  <button id="btn">Verifica</button>
  <div id="out" class="out"></div>
</main>
<script src="/verify.js"></script>
</body>
</html>
